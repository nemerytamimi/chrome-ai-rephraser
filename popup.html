<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Rephraser</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">✦</div>
        <span class="logo-text">AI Rephraser</span>
      </div>
      <button class="settings-btn" id="openSettings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-label" id="statusLabel">Loading…</span>
    </div>

    <div class="section-label">Rephrase Mode</div>
    <div class="mode-grid">
      <button class="mode-btn active" data-mode="rephrase">✦ Rephrase</button>
      <button class="mode-btn" data-mode="formal">🎩 Formal</button>
      <button class="mode-btn" data-mode="casual">😊 Casual</button>
      <button class="mode-btn" data-mode="concise">✂️ Concise</button>
      <button class="mode-btn" data-mode="expand">📝 Expand</button>
      <button class="mode-btn" data-mode="fix">✔️ Fix Grammar</button>
    </div>

    <div class="section-label">Quick Rephrase</div>
    <textarea class="quick-input" id="quickInput" placeholder="Paste text here to rephrase…" rows="4"></textarea>
    <button class="rephrase-btn" id="quickRephrase">Rephrase</button>
    <div class="quick-result" id="quickResult"></div>

    <div class="footer">
      <span>Right-click selected text or use the ✦ icon in any field</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
